name: VtT V5.1 acoustic smoke

on:
  push:
    branches:
      - "claude/voice-transcriber-multiplatform-6xifq1"
    paths:
      - ".github/workflows/vtt-v51-calibration.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade "sherpa-onnx==1.13.7" numpy av
      - name: Download official diarization test audio
        run: |
          curl -L --fail -o /tmp/1-two-speakers-en.wav https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/1-two-speakers-en.wav
          curl -L --fail -o /tmp/0-four-speakers-zh.wav https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/0-four-speakers-zh.wav
      - name: Run V5.1 acoustic smoke
        working-directory: desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          from vtt_diarization_v51 import DiarizationEngine

          engine = DiarizationEngine(Path('/tmp/vtt-v51-smoke-models'))
          cases = [
              ('/tmp/1-two-speakers-en.wav', 2),
              ('/tmp/0-four-speakers-zh.wav', 4),
          ]

          for job_index, (wav, expected) in enumerate(cases, 1):
              turns, meta = engine.diarize(
                  wav,
                  num_speakers=-1,
                  adaptive=True,
                  diar_profile='Equilibrada',
                  log=print,
                  progreso=lambda _pct: None,
              )
              detected = len({int(t['speaker']) for t in turns})
              iv = meta.get('identity_verification') or {}
              consistency = meta.get('identity_consistency') or {}
              print(
                  'SMOKE', Path(wav).name,
                  'expected', expected,
                  'detected', detected,
                  'passes', meta.get('passes'),
                  'identity', consistency.get('overall_confidence'),
                  'worker_job', meta.get('worker_job_index'),
                  'engine_reused', meta.get('engine_reused'),
                  'extractor_reused', iv.get('extractor_reused'),
                  'wall', meta.get('sherpa_process_wall_seconds'),
              )
              assert turns, f'{wav}: no se obtuvieron turnos'
              assert detected == expected, (wav, expected, detected, meta)
              assert iv.get('enabled') is True, (wav, iv)
              assert float(meta.get('sherpa_process_wall_seconds', 0.0) or 0.0) > 0.0
              assert int(meta.get('worker_job_index', 0) or 0) == job_index
              if job_index == 2:
                  assert meta.get('models_reused') is True, meta
                  assert meta.get('engine_reused') is True, meta
                  assert iv.get('extractor_reused') is True, iv
          PY
