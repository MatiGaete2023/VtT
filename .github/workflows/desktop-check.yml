name: Desktop checks

on:
  push:
    branches:
      - "claude/voice-transcriber-multiplatform-6xifq1"
      - "main"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "desktop/**"

jobs:
  check:
    name: py_compile + pytest en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Instalar Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Compilar (verificacion de sintaxis)
        working-directory: desktop
        run: >-
          python -m py_compile
          transcriptor_whisper.py vtt_core.py vtt_diarization.py
          vtt_diarization_adaptive.py vtt_diarization_process.py
          vtt_diarization_v4.py vtt_diarization_process_v4.py
          vtt_enhanced.py vtt_app.py vtt_ui_v4.py vtt_tuning.py
          vtt_reporting.py vtt_reporting_v4.py
          vtt_pipeline.py vtt_pipeline_v4.py
          vtt_alignment.py vtt_diarization_v5.py vtt_diarization_service.py
          vtt_reporting_v5.py vtt_validation.py vtt_pipeline_v5.py
          vtt_identity.py vtt_diarization_v51.py vtt_diarization_service_v51.py
          vtt_validation_v51.py vtt_reporting_v51.py vtt_pipeline_v51.py vtt_ui_v51.py
          vtt_identity_v52.py vtt_diarization_v52.py vtt_diarization_service_v52.py
          vtt_validation_v52.py vtt_reporting_v52.py vtt_performance.py
          vtt_pipeline_v52.py vtt_ui_v52.py benchmark_asr.py
          vtt_main.py run.py

      - name: Instalar dependencias de pruebas
        run: python -m pip install --upgrade pip pytest python-docx numpy

      - name: Ejecutar pruebas
        working-directory: desktop
        run: python -m pytest tests -q
