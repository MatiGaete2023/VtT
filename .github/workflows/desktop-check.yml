name: Desktop checks

on:
  push:
    branches:
      - "claude/voice-transcriber-multiplatform-6xifq1"
      - "main"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "desktop/**"

jobs:
  check:
    name: py_compile + pytest en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Tk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Compilar (verificacion de sintaxis)
        working-directory: desktop
        run: >-
          python -m py_compile
          transcriptor_whisper.py vtt_core.py vtt_diarization.py
          vtt_diarization_process.py vtt_enhanced.py vtt_app.py run.py

      - name: Instalar dependencias de pruebas
        run: python -m pip install --upgrade pip pytest python-docx

      - name: Ejecutar pruebas
        working-directory: desktop
        run: python -m pytest tests -q
