name: Android APK

on:
  push:
    branches:
      - "claude/voice-transcriber-multiplatform-6xifq1"
      - "main"
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/TranscriptorVtT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranscriptorVtT-debug-apk
          path: dist/TranscriptorVtT.apk
          if-no-files-found: error

      - name: Publish to a rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Transcriptor VtT (APK más reciente)
          body: |
            APK de depuración construido automáticamente desde la rama.
            Descarga `TranscriptorVtT.apk` y ábrelo en tu teléfono para instalar.
          files: dist/TranscriptorVtT.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build signed release APK (opcional)
    runs-on: ubuntu-latest
    # Solo corre si el repositorio tiene configurado el secreto del keystore
    # (ver android/README.md → "Firmar un APK de release"). Sin ese secreto,
    # este job se omite solo y no rompe nada.
    if: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar el keystore desde los secretos
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranscriptorVtT-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
