name: VtT V5 acoustic smoke

on:
  push:
    branches:
      - "claude/voice-transcriber-multiplatform-6xifq1"
    paths:
      - ".github/workflows/vtt-v5-smoke.yml"

jobs:
  acoustic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --upgrade "sherpa-onnx>=1.13.7" numpy av

      - name: Download official diarization test audio
        run: |
          curl -L --fail -o /tmp/1-two-speakers-en.wav https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/1-two-speakers-en.wav
          curl -L --fail -o /tmp/0-four-speakers-zh.wav https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/0-four-speakers-zh.wav

      - name: Run V5 on known-ground-truth audio
        working-directory: desktop
        run: |
          python - <<'PY'
          from pathlib import Path
          from vtt_diarization_v5 import DiarizationEngine

          engine = DiarizationEngine(Path('/tmp/vtt-v5-models'))
          cases = [
              ('/tmp/1-two-speakers-en.wav', 2),
              ('/tmp/0-four-speakers-zh.wav', 4),
          ]
          for index, (wav, expected) in enumerate(cases, 1):
              turns, meta = engine.diarize(
                  wav,
                  num_speakers=-1,
                  adaptive=True,
                  diar_profile='Equilibrada',
                  log=print,
                  progreso=lambda _p: None,
              )
              detected = len({int(t['speaker']) for t in turns})
              print('CASE', index, Path(wav).name, 'expected=', expected,
                    'detected=', detected, 'passes=', meta.get('passes'),
                    'threshold=', meta.get('selected_threshold'))
              print('TIMING', meta.get('sherpa_internal'))
              assert detected == expected, (wav, expected, detected, meta)
              assert meta.get('sherpa_process_wall_seconds', 0) > 0
              assert meta.get('sherpa_internal_timing_available') is True, meta
              internal = meta.get('sherpa_internal') or {}
              assert internal.get('segmentation_seconds', 0) > 0, internal
              assert internal.get('embedding_seconds', 0) > 0, internal
              if index == 2:
                  assert meta.get('models_reused') is True, meta
                  assert meta.get('engine_reused') is True, meta
          PY
