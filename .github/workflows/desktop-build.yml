name: Desktop executables

# Opcional: genera ejecutables independientes (no necesitan instalar Python).
# Se ejecuta manualmente desde la pestaña Actions.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name TranscriptorWhisper
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all onnxruntime
          --collect-all av
          --collect-all tokenizers
          --collect-all sounddevice
          --collect-all soundcard
          --collect-all numpy
          --collect-all cffi
          transcriptor_whisper.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TranscriptorWhisper-${{ matrix.os }}
          path: |
            desktop/dist/TranscriptorWhisper*
          if-no-files-found: error
