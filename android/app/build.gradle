plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firma de release opcional: si existe android/keystore.properties (no se
// versiona, ver .gitignore), se firma el APK de release con esa clave. Sin
// ese archivo, 'assembleRelease' sigue compilando igual (sin firmar), asi
// que nadie sin la clave se queda sin poder construir el proyecto.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def tieneKeystore = keystorePropertiesFile.exists()
if (tieneKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'cl.vtt.transcriptor'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'cl.vtt.transcriptor'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // Solo ARM de 64 bits: cubre practicamente todos los telefonos actuales
        // y mantiene el APK liviano (la prioridad es "bajar solo lo necesario").
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-O3 -std=c++17 -fexceptions'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (tieneKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // El APK de depuracion se firma con la clave de debug:
            // se puede instalar directamente en el telefono.
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (tieneKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
